name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:extension
        env:
          TRIPLEKEEL_API_BASE: ${{ vars.TRIPLEKEEL_API_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: triplekeel-extension
          path: apps/extension/triplekeel-extension.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:extension
        env:
          TRIPLEKEEL_API_BASE: ${{ vars.TRIPLEKEEL_API_BASE }}
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/extension/triplekeel-extension.zip
