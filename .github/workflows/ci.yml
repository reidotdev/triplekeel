name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Check the database catalog matches tracks/
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          node scripts/sync-catalog.mts --check
          node scripts/sync-catalog.mts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web:cloudflare
        env:
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dHJpcGxla2VlbC5jbGVyay5hY2NvdW50cy5kZXYk
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_EXTENSION_ID: pdnjcggmbannclgepccjfphlfchijfln
      - run: pnpm build:extension
        env:
          TRIPLEKEEL_API_BASE: ${{ vars.TRIPLEKEEL_API_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: triplekeel-extension
          path: apps/extension/triplekeel-extension.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:extension
        env:
          TRIPLEKEEL_API_BASE: ${{ vars.TRIPLEKEEL_API_BASE }}
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/extension/triplekeel-extension.zip

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_EXTENSION_ID: ${{ vars.NEXT_PUBLIC_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_EXTENSION_ID: ${{ vars.NEXT_PUBLIC_EXTENSION_ID }}
        run: |
          node -e 'const names = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "CLERK_SECRET_KEY", "CLERK_WEBHOOK_SECRET", "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_ACCESS_TOKEN", "SUPABASE_DB_PASSWORD", "EXA_API_KEY", "ANTHROPIC_API_KEY", "APP_URL", "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY", "NEXT_PUBLIC_SUPABASE_URL", "NEXT_PUBLIC_SUPABASE_ANON_KEY", "NEXT_PUBLIC_EXTENSION_ID"]; const missing = names.filter((name) => !process.env[name]); if (missing.length) { console.error(`Missing deployment settings: ${missing.join(", ")}`); process.exit(1); }'
      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm dlx supabase@3 db push --remote=dxkvltfrxzquqxzhzkxb --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Sync the track catalog
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-catalog.mts
      - name: Build OpenNext Worker
        run: pnpm --filter @triplekeel/web exec opennextjs-cloudflare build
      - name: Deploy Worker and upload runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          trap 'rm -f /tmp/triplekeel-worker-secrets.json' EXIT
          node -e 'const fs = require("node:fs"); const names = ["CLERK_SECRET_KEY", "CLERK_WEBHOOK_SECRET", "SUPABASE_SERVICE_ROLE_KEY", "EXA_API_KEY", "ANTHROPIC_API_KEY"]; const missing = names.filter((name) => !process.env[name]); if (missing.length) { console.error(`Missing GitHub secrets: ${missing.join(", ")}`); process.exit(1); } const values = Object.fromEntries(names.map((name) => [name, process.env[name]])); fs.writeFileSync("/tmp/triplekeel-worker-secrets.json", JSON.stringify(values), { mode: 0o600 });'
          pnpm --filter @triplekeel/web exec opennextjs-cloudflare deploy --keep-vars --secrets-file /tmp/triplekeel-worker-secrets.json --var "APP_URL:$APP_URL" --var "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" --var "NEXT_PUBLIC_SUPABASE_ANON_KEY:$NEXT_PUBLIC_SUPABASE_ANON_KEY" --var "NEXT_PUBLIC_EXTENSION_ID:$NEXT_PUBLIC_EXTENSION_ID"
