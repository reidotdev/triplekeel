# The 16 v0 questions retain their IDs, wording and area assignments.
questions:
  # Good
  - id: target_user
    text: Does the prompt name a specific user or audience?
    card_label: named a specific user or audience
    area: problem_discovery
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: problem
    text: Does it state the problem, not only the feature?
    card_label: stated the problem, not just the feature
    area: problem_discovery
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: success_metric
    text: Does it define what success looks like?
    card_label: set a success metric
    area: metrics
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: acceptance
    text: Does it give acceptance criteria?
    card_label: gave acceptance criteria
    area: specs
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: scope_cut
    text: Does it say what's out of scope or MVP-only?
    card_label: said what's out of scope
    area: prioritization
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: decomposed
    text: Does it split the task into steps?
    card_label: split the task into steps
    area: eng_design_collab
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: context_given
    text: Does it give examples, references or existing context?
    card_label: gave examples or existing context
    area: ai_prototyping
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: specific_feedback
    text: When iterating, is the feedback specific?
    card_label: gave specific feedback
    area: ai_prototyping
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: asks_tests
    text: Does it ask for a way to check the result?
    card_label: asked for a way to check the result
    area: ai_product_sense
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: cost_latency
    text: Does it mention cost, speed or limits?
    card_label: mentioned cost, speed or limits
    area: ai_product_sense
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: edge_cases
    text: Does it mention errors, empty states or edge cases?
    card_label: covered errors and edge cases
    area: specs
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: constraints
    text: Does it give technical constraints?
    card_label: gave technical constraints
    area: eng_design_collab
    polarity: good
    answers: [yes, partly, no, n/a]

  # Bad (anti-patterns, feed "Stop doing")
  - id: no_why
    text: Does it ask for a feature with no user or reason behind it?
    card_label: asked for a feature with no user or reason
    area: problem_discovery
    polarity: bad
    answers: [yes, partly, no, n/a]
  - id: kitchen_sink
    text: Does it ask for a whole product in one prompt, with no steps or priorities?
    card_label: asked for a whole product in one prompt
    area: prioritization
    polarity: bad
    answers: [yes, partly, no, n/a]
  - id: vague_fix
    text: Is it a follow-up that only says "fix it"?
    card_label: 'asked to "fix it" with no detail'
    area: ai_prototyping
    polarity: bad
    answers: [yes, partly, no, n/a]
  - id: blind_accept
    text: Does it accept output without checking it?
    card_label: accepted output without checking it
    area: ai_product_sense
    polarity: bad
    answers: [yes, partly, no, n/a]

  # Added for REI-273. These IDs are appended after QUESTION_IDS_V0.
  - id: metric_interpretation
    text: Does it ask how the feature changed a product metric?
    card_label: asked how a feature moved a metric
    area: metrics
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: audience_update
    text: Does it name who needs the update and what they need to decide?
    card_label: named who the update is for
    area: stakeholder_comms
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: stakeholder_tradeoff
    text: Does it state the trade-off stakeholders need to resolve?
    card_label: stated the trade-off to resolve
    area: stakeholder_comms
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: launch_readiness
    text: Does it name the launch audience and channel?
    card_label: named the launch audience and channel
    area: go_to_market
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: launch_learning
    text: Does it ask how launch results will be measured?
    card_label: planned how to measure the launch
    area: go_to_market
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: strategic_tradeoff
    text: Does it connect the product decision to a company goal?
    card_label: tied the decision to a company goal
    area: strategy
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: commercial_impact
    text: Does it name a business outcome such as revenue, retention or cost?
    card_label: named a business outcome
    area: strategy
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: agent_context
    text: Does it provide reusable project context for an AI agent?
    card_label: gave an AI agent reusable project context
    area: ai_agents_daily
    polarity: good
    answers: [yes, partly, no, n/a]
  - id: agent_workflow
    text: Does it define a repeatable AI workflow with human review?
    card_label: set up a repeatable AI workflow with review
    area: ai_agents_daily
    polarity: good
    answers: [yes, partly, no, n/a]
